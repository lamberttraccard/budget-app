services:
  web:
    command: >-
      php artisan optimize:clear &&
      APP_URL="$PUBLIC_URL" ASSET_URL="$PUBLIC_URL"
      php artisan serve --host=0.0.0.0 --port="$PORT"
    health: /up
    portal:
      title: Budget App
      description: Sign in with test@example.com / password.
  queue:
    command: php artisan queue:listen --tries=1 --timeout=0
